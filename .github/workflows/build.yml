name: Build Windows

# - push sur main / PR : tests + build, l'installeur est disponible dans les « Artifacts » du run
# - tag v* (ex. v0.1.0) : idem + création d'une Release GitHub en brouillon avec le .exe et le .msi
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Dépendances
        run: npm ci

      - name: Lint + types
        run: npm run lint

      - name: Tests TypeScript
        run: npm test

      - name: Tests Rust
        run: npm run test:rust

      - name: Build (+ Release brouillon si tag)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "PLC Snippets ${{ github.ref_name }}"
          releaseBody: "Installeur Windows (.exe, sans droits admin) et paquet .msi en pièces jointes."
          releaseDraft: true
          prerelease: false

      - name: Publier l'installeur dans les artifacts du run
        uses: actions/upload-artifact@v4
        with:
          name: plc-snippets-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/plc-snippets.exe
          if-no-files-found: error
