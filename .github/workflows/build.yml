name: Build Windows

# À chaque push sur main et sur les PR : lint, tests, build. L'installeur est disponible dans
# l'onglet Actions → le run → Artifacts. Pour publier une version : workflow « Publier une version ».
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Dépendances
        run: npm ci

      - name: Lint + types
        run: npm run lint

      - name: Tests TypeScript
        run: npm test

      - name: Tests Rust
        run: npm run test:rust

      - name: Build
        uses: tauri-apps/tauri-action@v1

      - name: Publier l'installeur dans les artifacts du run
        uses: actions/upload-artifact@v6
        with:
          name: plc-snippets-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/plc-snippets.exe
          if-no-files-found: error
