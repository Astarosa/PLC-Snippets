name: Build Windows

# Deux étapes :
#  - « verifier » sur chaque PR et chaque push sur main : lint, tests TypeScript et Rust ;
#  - « installeur » seulement sur main (après fusion) ou à la demande (Run workflow) : installeur
#    de test, compilé sans LTO pour aller vite. Onglet Actions → le run → Artifacts.
# L'installeur publié (optimisé et signé) est fabriqué par le workflow « Publier une version ».
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Cache lu partout, enregistré seulement depuis main : les PR profitent du cache de main
      # sans créer leurs propres caches de plus d'1 Go qui chasseraient le bon.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Dépendances
        run: npm ci

      - name: Lint + types
        run: npm run lint

      - name: Tests TypeScript
        run: npm test

      - name: Tests Rust
        run: npm run test:rust

  installeur:
    needs: verifier
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      # Installeur de test : pas de LTO ni de codegen-units = 1 (réservés à la release, voir
      # Cargo.toml), ce qui divise le temps de compilation. Le programme reste le même.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Dépendances
        run: npm ci

      - name: Build (installeur NSIS)
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles nsis

      - name: Publier l'installeur dans les artifacts du run
        uses: actions/upload-artifact@v6
        with:
          name: plc-snippets-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/plc-snippets.exe
          if-no-files-found: error
